name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm run lint

    - name: Run Build
      run: pnpm run build

    - name: Run Tests (com cobertura minima de 90%)
      # Aqui rodamos os testes sem precisar da DATABASE_URL real.
      # O script com cobertura aplica os thresholds globais (90%) do vitest.config.ts.
      run: pnpm run test:coverage
